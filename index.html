<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">

<title>Maxi Sport Osdorpplein | Sportkleding en sneakers</title>
<meta name="description" id="md" content="Maxi Sport op het Osdorpplein in Amsterdam: sportkleding, sneakers en trainingspakken van bekende merken.">
<style>
/* MAXI SPORT: STIJLBLAD. Kleuren en maten pas je hier aan (:root) */
:root{--k:#111111;--w:#FFFFFF;--r:#D71920;--l:#F4F4F4;--g:#333333;--top:36px;--h:76px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--h) + 12px)}
body{margin:0;font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:var(--k);background:var(--w);line-height:1.55}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
h1,h2,h3{font-weight:900;line-height:1.02;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(2.4rem,6vw,4.5rem);font-style:italic}
h2{font-size:clamp(1.8rem,3.6vw,2.8rem);font-style:italic}
:focus-visible{outline:3px solid var(--r);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.sr{position:absolute;left:-999px;width:1px;height:1px;overflow:hidden}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;padding:8px;z-index:200}

/* Groen Click & Collect-lampje */
.dot{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;background:#22c55e;border:1px solid rgba(255,255,255,.85);box-shadow:0 0 6px 2px rgba(34,197,94,.75);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 12px 5px rgba(34,197,94,.3)}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}

/* TOPBALK + NAVIGATIE */
.topbar{background:var(--r);color:#fff;font-size:.85rem;font-weight:700;height:var(--top);display:flex;align-items:center}
.topbar .wrap{display:flex;justify-content:space-between;gap:16px;width:100%}
.topbar a{text-decoration:none}.topbar a:hover{text-decoration:underline}
.cnl{display:inline-flex;gap:8px;align-items:center}
.site-header{background:var(--k);color:#fff;position:sticky;top:0;z-index:50;height:var(--h)}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:100%;padding:0 24px;max-width:1500px;margin:0 auto}
.nl{display:flex;align-items:center}.nr{display:flex;justify-content:flex-end;gap:8px}
.menu{list-style:none;margin:0;padding:0;display:flex;gap:4px}
.menu a{display:block;padding:26px 12px;text-decoration:none;font-weight:700;font-size:.95rem}
.menu a:hover,.menu a[aria-current]{box-shadow:inset 0 -4px var(--r)}
.has-sub{position:relative}
.sub{list-style:none;margin:0;padding:8px 0;position:absolute;top:100%;left:0;min-width:220px;background:var(--k);border-top:3px solid var(--r);display:none}
.has-sub:hover .sub,.has-sub:focus-within .sub{display:block}
.sub a{padding:10px 18px;font-weight:500}.sub a:hover{box-shadow:none;background:var(--g)}
.sub-toggle,.burger{display:none}
.logo img{height:58px;width:auto}
.call{display:inline-flex;gap:8px;align-items:center;background:var(--r);color:#fff;text-decoration:none;font-weight:800;padding:12px 20px;min-height:44px;border:2px solid var(--r)}
.call:hover{background:#fff;color:var(--r)}
.cartbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;background:none;border:2px solid #555;color:#fff;cursor:pointer}
.cartbtn:hover{border-color:#fff}
.cc{position:absolute;top:-8px;right:-8px;background:var(--r);color:#fff;font-size:.72rem;font-weight:800;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 4px}
.cc:empty{display:none}

/* KNOPPEN */
.btn{display:inline-block;background:var(--r);color:#fff;padding:16px 32px;font-weight:800;text-decoration:none;letter-spacing:.04em;border:2px solid var(--r);font-family:inherit;font-size:1rem;cursor:pointer}
.btn:hover{background:#fff;color:var(--r)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.dark{background:var(--k);border-color:var(--k)}.btn.dark:hover{background:#fff;color:var(--k)}
.btn.line{background:transparent;border-color:#fff}.btn.line:hover{background:#fff;color:var(--k)}

/* HERO: de banner is een afbeelding, de knop erop is een onzichtbare link op de juiste plek */
.hero{position:relative;background:var(--k)}
.hero img{width:100%;height:auto;aspect-ratio:1920/720;object-fit:cover}
.hb{position:absolute;display:block}
.hb:hover{background:rgba(215,25,32,.14)}
.hb.hd{left:5.5%;top:79.3%;width:21.4%;height:8.9%}
.hb.hm{display:none;left:7%;top:78.4%;width:50.4%;height:8.3%}

/* MERKBALKEN */
.brands{background:var(--l);padding:18px 0;overflow:hidden}
.marquee{display:flex;overflow:hidden;padding:12px 0}
.track{display:flex;flex:none;gap:56px;padding-right:56px;align-items:center;min-width:100%;justify-content:space-around;animation:l 40s linear infinite}
.marquee.rev .track{animation-direction:reverse}
.marquee:hover .track{animation-play-state:paused}
.track img{height:44px;width:auto;flex:none}
.track .bn{flex:none;font-weight:900;font-size:1.7rem;letter-spacing:.02em;text-transform:uppercase;color:var(--k);white-space:nowrap}
@keyframes l{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.track{animation:none}.marquee{overflow-x:auto}}

/* PRODUCTEN + MATEN ALS BLOKJES */
.new{padding-top:80px;padding-bottom:80px}
.sec-h{margin-bottom:40px}.sec-h p{margin:12px 0 0;color:var(--g)}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:32px 24px}
.prod{display:block}
.prod>a{display:block;text-decoration:none}
.prod img{width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--l);transition:opacity .2s}
.prod>a:hover img{opacity:.85}
.pb{display:block;margin-top:12px;font-size:.8rem;font-weight:800;color:var(--r)}
.pn{display:block;font-weight:700}.prod>a:hover .pn{text-decoration:underline}
.pp{display:block;color:var(--g)}
.sizes{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;border:0;min-width:0}
.sizes.err{outline:2px solid var(--r);outline-offset:4px}
.chip{position:relative}
.chip input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chip span{display:flex;align-items:center;justify-content:center;min-width:40px;min-height:40px;padding:0 8px;border:2px solid var(--k);background:#fff;font-weight:700;font-size:.9rem}
.chip:hover span{border-color:var(--r)}
.chip input:checked+span{background:var(--k);color:#fff}
.chip input:focus-visible+span{outline:3px solid var(--r);outline-offset:2px}
.add{margin-top:10px;width:100%;min-height:44px;background:var(--k);color:#fff;border:2px solid var(--k);font:inherit;font-weight:800;cursor:pointer}
.add:hover{background:var(--r);border-color:var(--r)}
.note{font-size:.85rem;color:#666;margin:24px 0}

/* PRODUCTPAGINA */
.pdp{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;padding:32px 24px 80px}
#gmain{width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--l)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.thumbs button{padding:0;border:2px solid transparent;background:none;cursor:pointer}
.thumbs button[aria-current=true]{border-color:var(--r)}
.thumbs img{width:100%;aspect-ratio:4/5;object-fit:cover}
.pdp h1{font-size:clamp(1.8rem,3.5vw,2.6rem);margin:6px 0 10px}
.pdp .price{font-size:1.5rem;font-weight:800}
.pdp .sizes{margin-top:18px}.pdp .chip span{min-width:48px;min-height:48px}
.pdp .add{margin-top:16px;min-height:52px}
.pdp h2{font-size:1.2rem;font-style:normal;margin:28px 0 10px}
.cnote{display:flex;gap:10px;align-items:center;font-weight:700;margin:16px 0}
.cnote .dot{border-color:#ddd}
.pdp dl{display:grid;grid-template-columns:130px 1fr;margin:0}
.pdp dt,.pdp dd{margin:0;padding:8px 0;border-bottom:1px solid #ddd}.pdp dt{font-weight:800}

/* INFO-BLOKKEN */
.usps{display:grid;grid-template-columns:repeat(4,1fr);background:var(--k);color:#fff}
.usp{padding:40px 28px;border-left:1px solid #333}.usp:first-child{border-left:0}
.usp h3{font-size:1.15rem;font-style:italic;margin-bottom:8px;color:#fff;border-left:5px solid var(--r);padding-left:12px}
.usp p{margin:0;color:#ccc}

/* OVER ONS */
.about{display:grid;grid-template-columns:1fr 1fr;background:var(--w)}
.about-i img{width:100%;height:100%;object-fit:cover;aspect-ratio:1000/1100}
.about-t{padding:80px 64px;align-self:center;max-width:640px}.about-t p{margin:20px 0;color:var(--g)}

/* SOCIAL */
.social{background:var(--l);padding:64px 0}
.social .wrap{display:flex;justify-content:space-between;align-items:center;gap:32px;flex-wrap:wrap}
.social p{margin:12px 0 0;color:var(--g);max-width:520px}
.social-btns{display:flex;gap:12px;flex-wrap:wrap}

/* FAQ */
.faq{padding-top:80px;padding-bottom:80px;max-width:900px}.faq h2{margin-bottom:32px}
.qa{border-top:2px solid var(--k)}.qa:last-child{border-bottom:2px solid var(--k)}
.qa h3{font-size:1.1rem;font-style:normal}
.qa button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;width:100%;padding:20px 0;font-weight:800}
.qa button:after{content:"+";color:var(--r);font-size:1.5rem;line-height:1}
.qa button[aria-expanded=true]:after{content:"\2212"}
.qa button:focus-visible{outline:3px solid var(--r)}
.ans p{margin:0 0 20px;color:var(--g)}

/* CATEGORIE, CLICK & COLLECT */
.crumbs{padding-top:24px;font-size:.9rem;color:var(--g)}
.crumbs a{text-decoration:none;font-weight:700}.crumbs a:hover{color:var(--r)}.crumbs span{color:var(--r);font-weight:700}
.banner{background:var(--k);color:#fff;margin-top:16px;padding:48px 0;border-bottom:6px solid var(--r)}
.banner p{max-width:640px;margin:16px 0 0;color:#ddd}
.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:32px 0 28px;padding:14px 0;border-top:2px solid var(--k);border-bottom:1px solid #ddd}
.filters label{font-weight:800}
.filters select,.filters input{font:inherit;padding:10px 14px;border:2px solid var(--k);background:#fff;min-height:44px}
#cnt{margin-left:auto;color:var(--g)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding-bottom:80px}
.tile{position:relative;color:#fff;text-decoration:none;display:block;overflow:hidden}
.tile img{width:100%;aspect-ratio:4/5;object-fit:cover}
.tile span{position:absolute;left:0;bottom:0;background:var(--k);padding:14px 22px;font-weight:900;font-style:italic;border-left:6px solid var(--r)}
.tile:hover span{background:var(--r)}
.cta-band{background:var(--k);color:#fff;margin-top:80px;padding:56px 0}
.cta-band .wrap{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 32px;max-width:700px}
.steps li{counter-increment:s;position:relative;padding:16px 0 16px 56px;border-bottom:1px solid #ddd}
.steps li:before{content:counter(s);position:absolute;left:0;top:12px;width:40px;height:40px;background:var(--r);color:#fff;font-weight:900;display:grid;place-items:center}

/* CONTACT */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding-bottom:40px}
.cgrid h2{font-size:1.2rem;margin:28px 0 8px;font-style:normal}.cgrid h2:first-child{margin-top:0}
.map iframe{width:100%;height:100%;min-height:380px;border:0;background:var(--l)}
table.hrs{border-collapse:collapse;width:100%;max-width:360px}
.hrs td{padding:7px 0;border-bottom:1px solid #ddd}.hrs td:last-child{text-align:right}
.hrs tr.today{font-weight:800;color:var(--r)}

/* WINKELMAND */
.ov{position:fixed;inset:0;background:rgba(17,17,17,.6);z-index:150}
.cart{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:160;display:flex;flex-direction:column;border-left:6px solid var(--r)}
.ch{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:2px solid var(--k)}
.ch h2{font-size:1.5rem}
.ch button{background:none;border:0;font-size:1.6rem;cursor:pointer;min-width:44px;min-height:44px}
.cb{flex:1;overflow:auto;padding:8px 24px}
.ci{display:grid;grid-template-columns:72px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid #ddd}
.ci img{width:72px;aspect-ratio:4/5;object-fit:cover;background:var(--l)}
.ci .t{font-weight:800}.ci .s{font-size:.85rem;color:var(--g)}
.qty{display:flex;align-items:center;gap:6px;margin-top:8px}
.qty button{min-width:36px;min-height:36px;border:2px solid var(--k);background:#fff;font:inherit;font-weight:800;cursor:pointer}
.qty button:hover{background:var(--k);color:#fff}
.qty .rm{margin-left:auto;border:0;text-decoration:underline;min-width:auto;font-weight:600}
.qty .rm:hover{background:none;color:var(--r)}
.cf{padding:20px 24px;border-top:2px solid var(--k);background:var(--l)}
.cf .tot{display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;margin-bottom:12px}
.cf .btn{display:block;text-align:center;width:100%;margin-top:8px;padding:14px 16px}
.cf small{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--g);font-size:.82rem}
.empty{padding:32px 0;color:var(--g)}

/* AFREKENEN */
.co{display:grid;grid-template-columns:1.3fr 1fr;gap:48px;padding:32px 24px 80px;align-items:start}
.co h2{font-size:1.3rem;font-style:normal;margin:28px 0 8px}.co h2:first-child{margin-top:0}
.f label.l{display:block;font-weight:800;margin:14px 0 6px}
.f input[type=text],.f input[type=email],.f input[type=tel]{width:100%;font:inherit;padding:10px 14px;border:2px solid var(--k);min-height:44px}
.f fieldset{border:0;padding:0;margin:0}
.opt{display:flex;gap:10px;align-items:center;border:2px solid var(--k);padding:12px 14px;margin-top:8px;cursor:pointer;font-weight:700}
.opt:has(input:checked){border-color:var(--r);background:var(--l)}
.opt small{display:block;font-weight:400;color:var(--g)}
.sum{background:var(--l);padding:24px;position:sticky;top:calc(var(--h) + 16px)}
.sum ul{list-style:none;margin:0;padding:0}
.sum li{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid #ddd}
.sum li.tot{font-weight:900;font-size:1.2rem;border:0}
.msg{background:#fff3f3;border-left:5px solid var(--r);padding:12px 16px;margin:16px 0 0}

/* FOOTER */
.site-footer{background:var(--k);color:#fff;border-top:6px solid var(--r);padding-top:56px}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.3fr;gap:40px}
.site-footer h3{font-size:1rem;margin-bottom:14px;color:var(--r)}
.site-footer ul{list-style:none;padding:0;margin:0}.site-footer li{margin-bottom:8px}
.site-footer a{text-decoration:none}.site-footer a:hover{text-decoration:underline}
.site-footer p{color:#ccc;max-width:320px}
.site-footer .hrs td{border-color:#333;padding:3px 0;font-size:.9rem}.site-footer .hrs tr.today{color:#fff}
.site-footer .hrs{max-width:260px}
.site-footer .flogo{height:64px;width:auto;margin-bottom:12px}
.copy{border-top:1px solid #333;margin-top:40px;padding:20px 24px;color:#999;font-size:.9rem}

/* MOBIEL EN TABLET */
@media(max-width:900px){
 :root{--h:64px}
 .nav{padding:0 12px}
 .topbar{font-size:.78rem}.topbar .addr{display:none}.topbar .wrap{justify-content:center;gap:14px}
 .burger{display:block;width:44px;height:44px;background:none;border:0;cursor:pointer;position:relative}
 .burger span,.burger span:before,.burger span:after{position:absolute;left:10px;width:24px;height:3px;background:#fff;content:""}
 .burger span{top:20px}.burger span:before{left:0;top:-8px}.burger span:after{left:0;top:8px}
 .menu{display:none;position:absolute;top:100%;left:0;right:0;background:var(--k);flex-direction:column;gap:0;max-height:calc(100vh - var(--h));overflow:auto;border-top:3px solid var(--r)}
 .menu.open{display:flex}.menu a{padding:16px 24px}
 .has-sub{display:flex;flex-wrap:wrap}.has-sub>a{flex:1}
 .sub-toggle{display:block;width:56px;background:none;border:0;color:#fff;cursor:pointer}
 .sub-toggle:after{content:"+";font-size:1.5rem;color:var(--r)}.sub-toggle[aria-expanded=true]:after{content:"\2212"}
 .sub{position:static;display:none;width:100%;border:0;background:var(--g)}
 .has-sub:hover .sub{display:none}.has-sub.open .sub{display:block}
 .logo img{height:48px}.call span{display:none}.call{padding:12px;justify-content:center;min-width:44px}
 .hero img{aspect-ratio:1080/1350}.hb.hd{display:none}.hb.hm{display:block}
 .pgrid,.tiles{grid-template-columns:repeat(2,1fr);gap:24px 16px}
 .cgrid,.about,.usps,.pdp,.co{grid-template-columns:1fr}.pdp,.co{gap:28px}.sum{position:static}
 .usp{border-left:0;border-top:1px solid #333}.usp:first-child{border-top:0}
 .new{padding-top:48px;padding-bottom:48px}.about-t{padding:48px 24px}
 .fgrid{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}#cnt{margin-left:0;width:100%}.social-btns .btn{width:100%;text-align:center}}
</style>
</head>

function nowAms(){
  var f=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Amsterdam",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()),o={};
  f.forEach(function(x){o[x.type]=x.value});
  var days={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  return {d:days[o.weekday],m:(+o.hour%24)*60+(+o.minute)};
}
function mins(t){var a=t.split(":");return +a[0]*60+ +a[1]}
function status(){
  var n=nowAms(),h=HOURS[n.d];
  if(h.open&&n.m>=mins(h.open)&&n.m<mins(h.dicht))return {open:true,tekst:"Nu geopend, tot "+h.dicht+" uur"};
  if(h.open&&n.m<mins(h.open))return {open:false,tekst:"Nu gesloten, vandaag open vanaf "+h.open+" uur"};
  for(var i=1;i<=7;i++){var x=HOURS[(n.d+i)%7];if(x.open)return {open:false,tekst:"Nu gesloten, "+(i===1?"morgen":x.dag)+" open vanaf "+x.open+" uur"}}
  return {open:false,tekst:"Nu gesloten"};
}

  +'<div><span class="pb" style="margin:0">'+p.brand+'</span><h1>'+esc(p.name)+'</h1><div class="price">'+(p.prijs||"Prijs op aanvraag")+'</div><p>'+I.tekst+'</p>'+sizes(p)+'<button class="add" data-add="'+p.id+'">IN WINKELMAND</button>'
  +'<p class="cnote"><i class="dot"></i>Click &amp; Collect: bestel online, haal gratis af in de winkel.</p>'
  +'<h2>Productinformatie</h2><dl><dt>Merk</dt><dd>'+p.brand+'</dd><dt>Categorie</dt><dd>'+c[0]+' · '+n+'</dd><dt>Materiaal</dt><dd>'+I.materiaal+'</dd><dt>Onderhoud</dt><dd>'+I.onderhoud+'</dd></dl>'
  +'<h2>Retourneren</h2><p>'+BELEID.retour+'</p><p class="note">Voorbeeldproduct: foto’s en productinformatie zijn voorbeelden.</p></div></section>';
}
function cnc(){
  return '<div class="wrap crumbs"><a href="#/">Home</a> / <span>Click &amp; Collect</span></div><section class="banner"><div class="wrap"><h1>CLICK &amp; COLLECT</h1><p>Online bestellen, gratis ophalen in de winkel op het Osdorpplein.</p></div></section>'
  +'<section class="wrap" style="padding:48px 24px 80px"><ol class="steps"><li><strong>Kies je producten en maat</strong><br>Zet ze in je winkelmandje.</li><li><strong>Kies Click &amp; Collect bij het afrekenen</strong><br>Reken online af. Er zijn geen verzendkosten.</li><li><strong>Haal je bestelling op</strong><br>Kom langs op het Osdorpplein. '+SERVICE.tekst+'</li></ol><a class="btn" href="#/heren">SHOP NU</a></section>';
}
function checkout(){
  var hd='<div class="wrap crumbs"><a href="#/">Home</a> / <span>Afrekenen</span></div>';
  if(!CART.length)return hd+'<section class="wrap" style="padding:32px 24px 80px"><h1>AFREKENEN</h1><p class="empty">Je winkelmand is leeg.</p><a class="btn" href="#/heren">SHOP NU</a></section>';
  var rows=CART.map(function(c){var p=PBYID[c.id],n=priceNum(p);return '<li><span>'+c.qty+'× '+p.brand+' '+esc(p.name)+(c.maat?' (maat '+c.maat+')':'')+'</span><span>'+(n!==null?money(n*c.qty):'op aanvraag')+'</span></li>'}).join("");
  return hd+'<section class="wrap co"><form id="co" class="f"><h1 style="font-size:2.2rem;margin-bottom:8px">AFREKENEN</h1>'
  +'<h2>Jouw gegevens</h2><label class="l" for="naam">Naam</label><input type="text" id="naam" name="naam" autocomplete="name" required><label class="l" for="em">E-mailadres</label><input type="email" id="em" name="email" autocomplete="email" required><label class="l" for="tel">Telefoon</label><input type="tel" id="tel" name="tel" autocomplete="tel" required>'
  +'<h2>Levering</h2><fieldset><legend class="sr">Levering</legend><label class="opt"><input type="radio" name="lev" value="cnc" checked><span><i class="dot"></i> Click &amp; Collect<small>Afhalen in de winkel, gratis</small></span></label><label class="opt"><input type="radio" name="lev" value="bez"><span>Thuis bezorgen<small>'+money(SHIP.kosten)+'</small></span></label></fieldset>'
  +'<div id="adr" hidden><label class="l" for="str">Straat en huisnummer</label><input type="text" id="str" name="straat" autocomplete="street-address"><label class="l" for="pc">Postcode</label><input type="text" id="pc" name="pc" autocomplete="postal-code"><label class="l" for="pl">Plaats</label><input type="text" id="pl" name="plaats" autocomplete="address-level2"></div>'
  +'<h2>Betalen</h2><fieldset><legend class="sr">Betaalmethode</legend><label class="opt"><input type="radio" name="pay" value="ideal" checked><span>iDEAL</span></label><label class="opt"><input type="radio" name="pay" value="card"><span>Creditcard of bankpas</span></label></fieldset>'
  +'<p class="msg" id="comsg" role="alert" hidden></p><button class="btn" id="paybtn" type="submit" style="margin-top:24px;width:100%"></button><p class="note">'+BELEID.retour+'</p></form>'
  +'<aside class="sum" aria-label="Overzicht"><h2 style="font-size:1.3rem;font-style:normal;margin-bottom:12px">Jouw bestelling</h2><ul>'+rows+'<li><span>Verzending</span><span id="sh"></span></li><li class="tot"><span>Totaal</span><span id="tt"></span></li></ul></aside></section>';
}
function updTotals(){
  var f=document.getElementById("co");if(!f)return;
  var b=f.elements.lev.value==="bez",t=cartSum(),sh=b?SHIP.kosten:0;
  document.getElementById("sh").textContent=b?money(sh):"Gratis";
  document.getElementById("tt").textContent=t.all?money(t.s+sh):"Prijs wordt bevestigd";
  var pb=document.getElementById("paybtn");pb.textContent=t.all?"BETAAL "+money(t.s+sh):"PRIJS ONTBREEKT, BEL ONS";pb.disabled=!t.all;
  var a=document.getElementById("adr");a.hidden=!b;a.querySelectorAll("input").forEach(function(i){i.required=b});
}
function contact(){
  return '<div class="wrap crumbs"><a href="#/">Home</a> / <span>Contact</span></div><section class="banner"><div class="wrap"><h1>CONTACT</h1><p>Kom langs, bel ons of plan je route naar de winkel.</p></div></section>'
  +'<section class="wrap cgrid" style="padding-top:48px"><div><h2>Winkel</h2><p>'+SHOP.naam+'<br>'+SHOP.straat+'<br>'+SHOP.postcode+' '+SHOP.plaats+'</p><p><a class="btn dark" href="'+MAP_ROUTE+'" target="_blank" rel="noopener">PLAN JE ROUTE</a></p><h2>Bellen</h2><p><a href="tel:'+SHOP.telefoonLink+'"><strong>'+SHOP.telefoonTekst+'</strong></a></p><h2>Openingstijden</h2><p><strong>'+status().tekst+'</strong></p>'+hoursTable()+'</div><div class="map"><iframe title="Kaart van Maxi Sport, '+ADRES+'" src="'+MAP_EMBED+'" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div></section>'+social()+faq();
}

/* Router: #/  #/heren  #/heren/schoenen  #/product/id  #/afrekenen  #/click-collect  #/contact  #/over-ons */
function route(){
  var h=location.hash.replace(/^#\/?/,"").split("/");R.a=h[0]||"";R.b=h[1]||"";
  var m=document.getElementById("main"),t="Sportkleding en sneakers",d="Maxi Sport op het Osdorpplein in Amsterdam: sportkleding, sneakers en trainingspakken van bekende merken.",html;
  if(R.a==="contact"){html=contact();t="Contact";d="Adres, telefoonnummer en openingstijden van Maxi Sport, "+ADRES+"."}
  else if(R.a==="product"&&PBYID[R.b]){var pp=PBYID[R.b];html=product(R.b);t=pp.name+" "+pp.brand;d=pp.name+" van "+pp.brand+" bij Maxi Sport op het Osdorpplein in Amsterdam."}
  else if(R.a==="afrekenen"){html=checkout();t="Afrekenen";d="Reken je bestelling af bij Maxi Sport."}
  else if(R.a==="click-collect"){html=cnc();t="Click & Collect";d="Bestel online en haal gratis af in de winkel van Maxi Sport op het Osdorpplein."}
  else if(CATS[R.a]&&R.b&&CATS[R.a][1].some(function(x){return x[0]===R.b})){html=cat(R.a,R.b);t=CATS[R.a][0]+" "+subName(R.a,R.b);d=t+" bij Maxi Sport op het Osdorpplein in Amsterdam."}
  else if(CATS[R.a]){html=hub(R.a);t=CATS[R.a][0];d=t+" sportkleding en schoenen bij Maxi Sport op het Osdorpplein."}
  else{html=home();if(R.a!=="over-ons")R.a=""}
  m.innerHTML=html;
  document.getElementById("tb").innerHTML=topbar();document.getElementById("hd").innerHTML=header();document.getElementById("ft").innerHTML=footer();badge();
  document.title=t+" | Maxi Sport Osdorpplein";document.getElementById("md").setAttribute("content",d);
  updTotals();
  var g=document.getElementById("grid");
  if(g){
    var list=P.filter(function(p){return p.cat===R.a&&p.sub===R.b}),sb=document.getElementById("bf"),q=document.getElementById("q"),so=document.getElementById("so"),cnt=document.getElementById("cnt");
    list.map(function(p){return p.brand}).filter(function(v,i,a){return a.indexOf(v)===i}).sort().forEach(function(v){var o=document.createElement("option");o.value=o.textContent=v;sb.appendChild(o)});
    var draw=function(){
      var f=list.filter(function(p){return(!sb.value||p.brand===sb.value)&&(!q.value||(p.name+" "+p.brand).toLowerCase().indexOf(q.value.toLowerCase())>-1)});
      if(so.value)f.sort(function(a,b){return so.value==="az"?a.name.localeCompare(b.name):b.name.localeCompare(a.name)});
      g.innerHTML=f.length?f.map(card).join(""):'<p>Geen producten gevonden. Pas je filter aan.</p>';cnt.textContent=f.length+" producten";
    };
    sb.addEventListener("change",draw);so.addEventListener("change",draw);q.addEventListener("input",draw);draw();
  }
  if(R.a==="over-ons"){document.getElementById("over-ons").scrollIntoView()}else{window.scrollTo(0,0)}
}

/* Klikgedrag */
document.addEventListener("click",function(e){
  var t=e.target;
  if(t.closest("#sk")){e.preventDefault();document.getElementById("main").focus();return}
  var gb=t.closest("[data-g]");
  if(gb){document.getElementById("gmain").src=GAL[+gb.getAttribute("data-g")];document.querySelectorAll("[data-g]").forEach(function(x){x.removeAttribute("aria-current")});gb.setAttribute("aria-current","true");return}
  var add=t.closest("[data-add]");
  if(add){
    var id=add.getAttribute("data-add"),first=document.querySelector('input[name="m-'+id+'"]'),maat="";
    if(first){
      var ch=document.querySelector('input[name="m-'+id+'"]:checked');
      if(!ch){first.closest(".sizes").classList.add("err");first.focus();say("Kies eerst een maat");return}
      maat=ch.value;
    }
    addToCart(id,maat);var old=add.textContent;add.textContent="TOEGEVOEGD ✓";setTimeout(function(){add.textContent=old},1200);return;
  }
  if(t.closest("[data-close]"))closeCart();
  if(t.closest("#cartbtn")){openCart();return}
  if(t.closest("#cartclose")||t.closest("#ov")){closeCart();return}
  var qb=t.closest("[data-q]");
  if(qb){var i=+qb.getAttribute("data-i"),a=qb.getAttribute("data-q");
    if(a==="inc")CART[i].qty++;else if(a==="dec"){CART[i].qty--;if(CART[i].qty<1)CART.splice(i,1)}else CART.splice(i,1);
    saveCart();badge();renderCart();if(R.a==="afrekenen")route();return}
  var b=t.closest(".burger"),m=document.getElementById("menu");
  if(b){var o=m.classList.toggle("open");b.setAttribute("aria-expanded",o);return}
  var s=t.closest(".sub-toggle");
  if(s){var o2=s.parentNode.classList.toggle("open");s.setAttribute("aria-expanded",o2);return}
  var qa=t.closest(".qa button");
  if(qa){var an=document.getElementById(qa.getAttribute("aria-controls")),open=qa.getAttribute("aria-expanded")==="true";qa.setAttribute("aria-expanded",!open);an.hidden=open}
});
document.addEventListener("change",function(e){
  var t=e.target;if(t.name==="lev")updTotals();
  var s=t.closest&&t.closest(".sizes");if(s)s.classList.remove("err");
});
/* Afrekenen: stuurt de bestelling (zonder prijzen) naar PAY.url en gaat door naar de betaalpagina */
document.addEventListener("submit",function(e){
  var f=e.target;if(f.id!=="co")return;e.preventDefault();
  var d=new FormData(f),bez=d.get("lev")==="bez",m=document.getElementById("comsg");
  var order={klant:{naam:d.get("naam"),email:d.get("email"),telefoon:d.get("tel")},levering:bez?"bezorgen":"click-collect",adres:bez?{straat:d.get("straat"),postcode:d.get("pc"),plaats:d.get("plaats")}:null,betaalmethode:d.get("pay"),
    regels:CART.map(function(c){var p=PBYID[c.id];return {id:c.id,merk:p.brand,naam:p.name,maat:c.maat,aantal:c.qty}})};
  m.hidden=false;
  if(!PAY.url){m.textContent="Online betalen is nog niet gekoppeld aan een betaalprovider. Bel ons op "+SHOP.telefoonTekst+" om je bestelling af te ronden.";return}
  m.textContent="Je wordt doorgestuurd naar het betalen…";
  fetch(PAY.url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(order)})
   .then(function(r){return r.json()})
   .then(function(x){if(x&&x.url){location.href=x.url}else{throw 0}})
   .catch(function(){m.textContent="Er ging iets mis bij het starten van de betaling. Probeer het opnieuw of bel ons op "+SHOP.telefoonTekst+"."});
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){var m=document.getElementById("menu");if(m)m.classList.remove("open");if(!document.getElementById("cart").hidden)closeCart()}
});
window.addEventListener("hashchange",route);
setInterval(function(){document.getElementById("tb").innerHTML=topbar()},60000);
renderCart();route();
</script>
